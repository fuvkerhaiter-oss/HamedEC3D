# CI: every push and pull request. Needs NO secrets: integration tests start their own throwaway PostgreSQL
# (embedded-postgres), the build runs without a database (pages prerender empty and fill in on revalidation),
# and e2e uses a fresh local database + production build (tools/db/e2e-server.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, lint, unit, integration, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Dependency audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    env:
      E2E_CHANNEL: ""
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
